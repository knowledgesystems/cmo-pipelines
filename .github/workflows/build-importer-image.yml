# Rebuilds the importer image whenever this branch is pushed to.
#
# A push event only ever runs the workflow copy on the branch that was pushed,
# so the trigger has to live here. The build itself is the reusable workflow on
# master, which also owns the schedule/dispatch triggers — those only ever run
# the default-branch copy. Nothing to keep in sync: this file is only a trigger.
#
# The build checks out master for docker/Dockerfile, docker/ and dags/, and this
# branch for import-scripts/.
name: Build importer image

on:
  push:
    branches: [import-hackathon]

jobs:
  build:
    uses: knowledgesystems/cmo-pipelines/.github/workflows/build-importer-image.yml@master
    secrets: inherit
