# Rebuilds the importer image used by the import_public_hackathon DAG
# (docker/Dockerfile) whenever import-hackathon is committed to, or when
# cbioportal-core is.
#
# The image is assembled from two branches. docker/, dags/ and the Dockerfile
# come from master; import-scripts/ comes from import-hackathon, which carries
# script changes that cannot be merged to master while pipelines3 deploys from
# it. Both are checked out below and the import-scripts/ tree is overlaid onto
# the master checkout before the build, so docker/Dockerfile's COPYs pick up the
# import-hackathon versions without knowing anything about branches.
#
# cbioportal-core lives in another repo, and GitHub Actions cannot subscribe to
# another repo's push events. Three ways in, in order of latency:
#   repository_dispatch  - instant, but needs a workflow in cbioportal-core to
#                          fire it (nothing sends this event yet)
#   schedule             - polls the tracked branch and builds when its head SHA
#                          has moved since the last build
#   workflow_dispatch    - manual, with an optional ref override
#
# A push event runs the copy of this file on the branch that was pushed, so this
# file must exist on import-hackathon for the push trigger to fire at all.
# schedule/repository_dispatch/workflow_dispatch are the opposite: they only ever
# run the copy on the default branch (master). Keep both copies in sync.
name: Build importer image

on:
  push:
    branches: [import-hackathon]
  schedule:
    # Every 6 hours; the build is skipped when no tracked SHA has moved.
    - cron: '17 */6 * * *'
  repository_dispatch:
    types: [cbioportal-core-push]
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'cbioportal-core ref to build against (default: the SHA pinned in docker/Dockerfile)'
        required: false
        type: string

env:
  IMAGE: ghcr.io/cbioportal/containerized-importer-cmo
  CORE_REPO: cBioPortal/cbioportal-core
  CORE_BRANCH: containerized
  INFRA_BRANCH: master
  SCRIPTS_BRANCH: import-hackathon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Dockerfile, docker/ and dags/ always come from master, whichever branch
      # triggered the run.
      - name: Checkout master (Dockerfile, docker/, dags/)
        uses: actions/checkout@v4
        with:
          ref: master

      # On a push, build the exact commit that was pushed rather than whatever
      # the branch head happens to be by the time the runner starts.
      - name: Checkout import-hackathon (import-scripts/)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'import-hackathon' }}
          path: .scripts-branch

      - name: Resolve branch SHAs
        id: refs
        run: |
          set -euo pipefail
          {
            echo "infra_sha=$(git rev-parse HEAD)"
            echo "scripts_sha=$(git -C .scripts-branch rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      # docker/Dockerfile COPYs import-scripts/*.sh from the build context, so
      # swapping the tree here is all it takes to build against import-hackathon.
      - name: Overlay import-scripts/ from import-hackathon
        run: |
          set -euo pipefail
          rm -rf import-scripts
          mv .scripts-branch/import-scripts import-scripts
          rm -rf .scripts-branch

      # The Dockerfile pins CBIOPORTAL_CORE_REF to a SHA on purpose, so a plain
      # rebuild cannot pick up different core scripts. Only core-triggered runs
      # override it; a push to this repo builds exactly what is pinned.
      - name: Resolve cbioportal-core ref
        id: core
        run: |
          set -euo pipefail
          pinned=$(grep -oP '(?<=^ARG CBIOPORTAL_CORE_REF=).*' docker/Dockerfile)
          head=$(git ls-remote "https://github.com/${CORE_REPO}.git" "${CORE_BRANCH}" | cut -f1)
          case "${{ github.event_name }}" in
            push)  ref="$pinned" ;;
            *)     ref="${{ inputs.core_ref }}"; ref="${ref:-$head}" ;;
          esac
          {
            echo "pinned=$pinned"
            echo "head=$head"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"
          if [ "$pinned" != "$head" ]; then
            echo "::notice::cbioportal-core ${CORE_BRANCH} is at ${head}, docker/Dockerfile pins ${pinned}"
          fi

      # Marks the (master SHA, import-hackathon SHA, core ref) triple as built.
      # On scheduled runs a cache hit means nothing has moved, so the build is
      # skipped.
      - name: Check whether this combination was already built
        id: built
        uses: actions/cache@v4
        with:
          path: .built-marker
          key: importer-${{ steps.refs.outputs.infra_sha }}-${{ steps.refs.outputs.scripts_sha }}-${{ steps.core.outputs.ref }}

      - name: Set up Docker Buildx
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build image
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: CBIOPORTAL_CORE_REF=${{ steps.core.outputs.ref }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.refs.outputs.scripts_sha }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          date -u +%FT%TZ > .built-marker
          {
            echo "### Importer image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | ${{ github.event_name }} |"
            echo "| ${{ env.INFRA_BRANCH }} (docker/, dags/) | \`${{ steps.refs.outputs.infra_sha }}\` |"
            echo "| ${{ env.SCRIPTS_BRANCH }} (import-scripts/) | \`${{ steps.refs.outputs.scripts_sha }}\` |"
            echo "| cbioportal-core built | \`${{ steps.core.outputs.ref }}\` |"
            echo "| cbioportal-core pinned | \`${{ steps.core.outputs.pinned }}\` |"
            echo "| ${{ env.CORE_BRANCH }} head | \`${{ steps.core.outputs.head }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
