# Rebuilds the cbioportal-core importer image (docker/core.Dockerfile). The
# build context is a cbioportal-core checkout while the Dockerfile comes from
# this repo; both are checked out below and handed to buildx separately.
#
# repository_dispatch is for cbioportal-core to poke on its pushes — NOTHING
# SENDS IT YET, so a core change currently needs a manual workflow_dispatch run.
name: Build cbioportal-core image

on:
  push:
    branches: [master]
    paths:
      - docker/core.Dockerfile
      - .github/workflows/build-core-image.yml
  repository_dispatch:
    types: [cbioportal-core-push]
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'cbioportal-core ref to build (default: head of the tracked branch)'
        required: false
        type: string

env:
  IMAGE: ghcr.io/cbioportal/containerized-importer-core
  CORE_REPO: cBioPortal/cbioportal-core
  CORE_BRANCH: main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cmo-pipelines (Dockerfile)
        uses: actions/checkout@v4
        with:
          path: cmo-pipelines

      - name: Resolve cbioportal-core ref
        id: core
        run: |
          set -euo pipefail
          ref="${{ inputs.core_ref }}"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote "https://github.com/${CORE_REPO}.git" "${CORE_BRANCH}" | cut -f1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout cbioportal-core (build context)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ steps.core.outputs.ref }}
          path: cbioportal-core

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: cbioportal-core
          file: cmo-pipelines/docker/core.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.core.outputs.ref }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
