# Rebuilds the cbioportal-core importer image (docker/core.Dockerfile) whenever
# cbioportal-core is committed to, or when the Dockerfile itself changes here.
#
# core.Dockerfile's COPYs (pom.xml, src/, scripts/, requirements.txt) are
# cbioportal-core's layout, so the build context must be a cbioportal-core
# checkout while the Dockerfile comes from this repo. Both are checked out
# below and handed to buildx separately.
#
# Same trigger caveat as build-importer-image.yml: schedule, repository_dispatch
# and workflow_dispatch only run from the default branch.
name: Build cbioportal-core image

on:
  push:
    branches: [master]
    paths:
      - docker/core.Dockerfile
      - .github/workflows/build-core-image.yml
  schedule:
    - cron: '47 */6 * * *'
  repository_dispatch:
    types: [cbioportal-core-push]
  workflow_dispatch:
    inputs:
      core_ref:
        description: 'cbioportal-core ref to build (default: head of the tracked branch)'
        required: false
        type: string

env:
  IMAGE: ghcr.io/cbioportal/containerized-importer-core
  CORE_REPO: cBioPortal/cbioportal-core
  CORE_BRANCH: containerized

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cmo-pipelines (Dockerfile)
        uses: actions/checkout@v4
        with:
          path: cmo-pipelines

      - name: Resolve cbioportal-core ref
        id: core
        run: |
          set -euo pipefail
          ref="${{ inputs.core_ref }}"
          if [ -z "$ref" ]; then
            ref=$(git ls-remote "https://github.com/${CORE_REPO}.git" "${CORE_BRANCH}" | cut -f1)
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout cbioportal-core (build context)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPO }}
          ref: ${{ steps.core.outputs.ref }}
          path: cbioportal-core

      - name: Check whether this ref was already built
        id: built
        uses: actions/cache@v4
        with:
          path: .built-marker
          key: core-${{ steps.core.outputs.ref }}-${{ hashFiles('cmo-pipelines/docker/core.Dockerfile') }}

      - name: Set up Docker Buildx
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PUSH_TOKEN }}

      - name: Build image
        if: steps.built.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: cbioportal-core
          file: cmo-pipelines/docker/core.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ steps.core.outputs.ref }}
            ${{ env.IMAGE }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build
        if: steps.built.outputs.cache-hit != 'true'
        run: |
          date -u +%FT%TZ > .built-marker
          {
            echo "### cbioportal-core image"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| trigger | ${{ github.event_name }} |"
            echo "| cbioportal-core | \`${{ steps.core.outputs.ref }}\` |"
            echo "| Dockerfile from | \`${{ github.sha }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
